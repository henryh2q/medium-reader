<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Đọc gì hôm nay{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Kho bài kỹ thuật được chọn lọc và dịch sang tiếng Việt: system design, AI, phỏng vấn kỹ sư phần mềm.{% endblock %}">
  {% block meta_robots %}{% endblock %}
  <link rel="canonical" href="{% block canonical %}{{ request.url.scheme }}://{{ request.url.netloc }}{{ request.url.path }}{% endblock %}">
  <meta property="og:site_name" content="Đọc gì hôm nay">
  <meta property="og:type" content="{% block og_type %}website{% endblock %}">
  <meta property="og:title" content="{% block og_title %}Đọc gì hôm nay{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Kho bài kỹ thuật được chọn lọc và dịch sang tiếng Việt.{% endblock %}">
  <meta property="og:image" content="{% block og_image %}https://{{ request.url.hostname }}/static/favicon/favicon-512.png{% endblock %}">
  <meta name="twitter:card" content="summary">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16.png">
  <link rel="apple-touch-icon" href="/static/favicon/apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/static/favicon/apple-touch-icon-120.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/static/favicon/apple-touch-icon-152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/static/favicon/apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Đọc gì hôm nay">
  <meta name="theme-color" content="#1d5d86">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body {% block body_attrs %}{% endblock %}>
  {% block content %}{% endblock %}
</body>
</html>
